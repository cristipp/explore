[package]
name = "factor"
version = "0.1.0"
edition = "2024"

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
rayon = "1"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
