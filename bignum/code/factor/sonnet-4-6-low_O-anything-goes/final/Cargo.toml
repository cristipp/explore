[package]
name = "factor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "factor"
path = "src/main.rs"

[dependencies]
rusqsieve = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
